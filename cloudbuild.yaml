steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/my-portal:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/my-portal:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/my-portal']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'my-portal'
      - '--image'
      - 'gcr.io/$PROJECT_ID/my-portal:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/my-portal:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/my-portal:latest'

# The image installs build-essential, WeasyPrint's native deps and downloads a
# font, so it needs more than the default 10 minute build budget.
timeout: 1800s

# Use the Cloud Build service account with necessary permissions
options:
  logging: CLOUD_LOGGING_ONLY
