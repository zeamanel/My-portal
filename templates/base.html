<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odaflux Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .navbar {
            background: #1e293b;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .navbar a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 24px;
            font-weight: 600;
        }

        .navbar a:hover {
            color: #38bdf8;
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .btn {
            background: #38bdf8;
            border: none;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary {
            background: #475569;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
        }

        input,
        textarea,
        select {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            width: 100%;
        }

        .grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .sidebar {
            width: 280px;
        }

        .main {
            flex: 1;
        }

        .agent-card {
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid #334155;
        }

        .agent-card.selected {
            border-color: #38bdf8;
            background: #1e293b;
        }

        .image-preview {
            max-width: 100%;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        textarea {
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div><strong>🔷 Odaflux Portal</strong></div>
        <div>
            <a href="/context-builder">Context Builder</a>
            <a href="/ocr">OCR</a>
            <a href="/ugc-analysis">UGC Analysis</a>
            <a href="/template-factory">Template Factory</a>
            <a href="/admin/agents">Agents</a>
            <a href="/admin/users">Users</a>
            <a href="#" id="logoutBtn">Logout</a>
        </div>
    </div>
    <div class="container" id="app">
        {% block content %}{% endblock %}
    </div>
    <script>
        // Supabase Compatibility Auth Bridge (Powered by Native Google Cloud / JWT)
        window.getAuthToken = function() {
            return localStorage.getItem('portal_token');
        };

        window.supabaseClient = {
            auth: {
                getSession: async function() {
                    const token = localStorage.getItem('portal_token');
                    return { data: { session: token ? { access_token: token } : null } };
                },
                signOut: async function() {
                    localStorage.removeItem('portal_token');
                    localStorage.removeItem('portal_user');
                    window.location.href = '/';
                }
            }
        };

        // Enforce auth check on protected views
        if (!window.getAuthToken()) {
            window.location.href = '/';
        }

        document.getElementById('logoutBtn')?.addEventListener('click', async (e) => {
            e.preventDefault();
            await window.supabaseClient.auth.signOut();
        });
    </script>
</body>

</html>
