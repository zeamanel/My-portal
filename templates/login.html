<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login – Odaflux</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 36px 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-header .logo-icon {
            font-size: 36px;
            color: #38bdf8;
            margin-bottom: 12px;
        }
        .login-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }
        .login-header p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
        }
        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 11px 12px 11px 36px;
            color: #f8fafc;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background: #0369a1;
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .alert-error {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            align-items: center;
            gap: 8px;
        }
        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon"><i class="fas fa-cubes"></i></div>
            <h1>Odaflux Portal</h1>
            <p>Sign in to manage AI agents, OCR & templates</p>
        </div>

        <div id="errorAlert" class="alert-error">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorMessage">Invalid email or password</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="name@domain.com" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span>Sign in</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="footer-note">
            Protected internal service &bull; Google Cloud Infrastructure
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    errorMessage.textContent = data.detail || 'Sign-in failed. Please verify your credentials.';
                    errorAlert.style.display = 'flex';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Sign in</span> <i class="fas fa-arrow-right"></i>';
                    return;
                }

                localStorage.setItem('portal_token', data.access_token);
                localStorage.setItem('portal_user', JSON.stringify(data.user));
                window.location.href = '/context-builder';
            } catch (err) {
                errorMessage.textContent = 'Connection error: ' + err.message;
                errorAlert.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign in</span> <i class="fas fa-arrow-right"></i>';
            }
        };
    </script>
</body>
</html>
